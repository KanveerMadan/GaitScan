[project]
name = "gaitscan"
version = "0.1.0"
description = "Video-based gait measurement API (experimental, not a medical device)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # web
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "python-multipart>=0.0.31",
    "pydantic>=2.11",
    "email-validator>=2.2",
    # auth (passlib + bcrypt<4 until ADR-004 moves hashing to bcrypt directly in Phase 4)
    "pyjwt>=2.10",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",
    # data
    "sqlalchemy>=2.0.43",
    "alembic>=1.16",
    # SQLAlchemy 2.1 maps postgresql:// to psycopg 3
    "psycopg[binary]>=3.2",
    # analysis (gaitcore)
    # Same release as @mediapipe/tasks-vision 1.0.1 (Tasks PoseLandmarker; model pinned in gaitcore/model.py)
    "mediapipe==1.0.1",
    "opencv-python-headless>=4.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    # reports
    "reportlab>=4.4",
    "pillow>=12.3",
    # observability
    "structlog>=25.4",
    "sentry-sdk[fastapi]>=2.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pandas-stubs",
    "types-passlib",
    "pypdf>=6.1",
    "types-reportlab>=5.0.0.20260911",
    "scipy-stubs>=1.17.1.5",
]

[tool.uv]
package = false
# mediapipe 1.0.1 declares the GUI build opencv-contrib-python (needs libGL) and sounddevice
# (PortAudio, audio tasks only). The pose Tasks API needs neither: cv2 comes from
# opencv-python-headless above. A never-true marker removes them from the lock.
override-dependencies = [
    "opencv-contrib-python; sys_platform == 'never'",
    "sounddevice; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# _audit/tests is the audit spec (expected failures until Phase 2); run it explicitly.
norecursedirs = ["_audit", ".venv", "node_modules", ".git"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["_audit", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = [
    "E501",   # long lines: formatter handles code; long strings are copy
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "T20"]

[tool.mypy]
python_version = "3.11"
files = ["gaitcore", "app"]
exclude = ["_audit/", "alembic/"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# gaitcore: strict (flags spelled out; `strict` is not honoured per-module).
[[tool.mypy.overrides]]
module = "gaitcore.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
extra_checks = true

# mediapipe 1.0.1 ships neither stubs nor py.typed.
[[tool.mypy.overrides]]
module = "mediapipe.*"
ignore_missing_imports = true
