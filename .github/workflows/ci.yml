name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gaitscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/gaitscan_test
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for opencv-contrib and mediapipe's native library (as in the Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Pinned pose model (gitignored; the Docker image fetches it the same way)
        run: uv run python gaitcore/model.py fetch
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test (SQLite + Postgres)
        run: uv run pytest -q
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t gaitscan-api:ci .
      - name: Smoke check the image (pinned model hash, MediaPipe load, one synthetic analysis)
        run: docker run --rm -e PYTHONPATH=/app -v "$PWD/tests:/t:ro" gaitscan-api:ci python /t/docker_smoke.py
