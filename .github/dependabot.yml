version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Held by mediapipe 0.10.9; upgraded together in Phase 2 (ADR-006).
      - dependency-name: mediapipe
      - dependency-name: protobuf
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
